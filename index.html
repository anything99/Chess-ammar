<!doctype html>
<html lang="en" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080A0D">
<title>Chess Academy</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell">
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/home"><span class="brand-mark">♔</span><span>Chess Academy</span></a>
    <nav id="sidenav" class="nav"></nav>
    <div class="side-foot"><span id="net" class="net"></span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <a class="brand brand-mobile" href="#/home"><span class="brand-mark">♔</span><span>Chess Academy</span></a>
      <div class="top-right">
        <a class="chip" href="#/profile" id="chip" aria-label="Open profile"></a>
        <a class="icon-btn" href="#/settings" id="settingsBtn" aria-label="Settings"></a>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav id="bottomnav" class="bottomnav" aria-label="Main"></nav>
</div>
<dialog id="confirm"><form method="dialog">
  <h3 id="confirmTitle"></h3><p id="confirmText"></p>
  <div class="row"><button class="btn ghost" value="no">Cancel</button><button class="btn danger" value="yes">Reset</button></div>
</form></dialog>
<script src="js/content.js"></script>
<script src="js/storage.js"></script>
<script src="js/progress.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
